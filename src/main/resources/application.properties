# 监听地址与端口。
# 注意：刻意不使用裸 PORT / HOST 变量名——某些宿主环境会注入 SERVER__PORT 之类的
# 同义变量，被 Spring 的宽松绑定命中后反而会覆盖此处配置。统一用 SHOP_ 前缀。
server.address=${SHOP_HOST:127.0.0.1}
server.port=${SHOP_PORT:3000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=file:./public/
spring.jackson.serialization.indent-output=true

# ---------- 持久化：SQLite（文件数据库，无需安装数据库服务、无需账号密码）----------
# 数据落在项目目录下的 ./data/shop.db，首次启动自动建表，拷走源码即可运行
spring.datasource.url=jdbc:sqlite:${SHOP_DB_FILE:./data/shop.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# 由实体类自动建表 / 补充字段，无需手写建表 SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# ---------- 图片存储目录 ----------
shopping.upload-dir=${SHOP_UPLOAD_DIR:./uploads}

# ---------- 旧数据迁移（一次性）----------
# 启动时若数据库为空且该 JSON 文件存在，则自动导入其中的商品/意向/卖家账号
shopping.legacy-data-file=${SHOP_DATA_FILE:./data.json}
