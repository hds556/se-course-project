<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>交易模块截图画册</title><style>body{font:16px/1.7 Microsoft YaHei,sans-serif;margin:40px auto;max-width:1240px;background:#f8f5ef;color:#302c29}figure{margin:30px 0 60px}img{max-width:100%;height:auto;border:1px solid #ddd}h1{color:#a64f37}a{color:#a64f37}nav{display:flex;gap:12px;flex-wrap:wrap}figcaption{margin:12px 0}</style><h1>交易模块截图画册</h1><p>12 张图对应 12 个禅道任务，来自本地隔离环境的真实浏览器截图；演示数据为临时数据。图片未补齐时下方会显示占位提示。</p><nav><a href="#shot0">01</a><a href="#shot1">02</a><a href="#shot2">03</a><a href="#shot3">04</a><a href="#shot4">05</a><a href="#shot5">06</a><a href="#shot6">07</a><a href="#shot7">08</a><a href="#shot8">09</a><a href="#shot9">10</a><a href="#shot10">11</a><a href="#shot11">12</a></nav><figure id="shot0"><h2>01_未登录详情无下单入口</h2><figcaption>未登录打开商品详情：只有"登录后提交购买意向"，没有任何可用下单入口</figcaption><a href="截图/01_未登录详情无下单入口.jpg"><img src="截图/01_未登录详情无下单入口.jpg" alt="未登录打开商品详情：只有"登录后提交购买意向"，没有任何可用下单入口" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/01_未登录详情无下单入口.jpg</p>')"></a></figure><figure id="shot1"><h2>02_登录后提交成功排队位次</h2><figcaption>客户登录后提交成功，提示当前排在第 1 位，且库存仍为 3 件</figcaption><a href="截图/02_登录后提交成功排队位次.jpg"><img src="截图/02_登录后提交成功排队位次.jpg" alt="客户登录后提交成功，提示当前排在第 1 位，且库存仍为 3 件" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/02_登录后提交成功排队位次.jpg</p>')"></a></figure><figure id="shot2"><h2>03_我的订单进行中两条记录</h2><figcaption>同一账号连续提交 2 次，"我的订单"出现 2 条独立记录，位次按时间排序</figcaption><a href="截图/03_我的订单进行中两条记录.jpg"><img src="截图/03_我的订单进行中两条记录.jpg" alt="同一账号连续提交 2 次，"我的订单"出现 2 条独立记录，位次按时间排序" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/03_我的订单进行中两条记录.jpg</p>')"></a></figure><figure id="shot3"><h2>04_后台交易管理队列</h2><figcaption>后台交易管理显示队列 3 人，队首、第 2 位、第 3 位与提交时间一一对应</figcaption><a href="截图/04_后台交易管理队列.jpg"><img src="截图/04_后台交易管理队列.jpg" alt="后台交易管理显示队列 3 人，队首、第 2 位、第 3 位与提交时间一一对应" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/04_后台交易管理队列.jpg</p>')"></a></figure><figure id="shot4"><h2>05_发起交易后列表不可见</h2><figcaption>发起交易后商品被冻结，买家端列表与搜索结果中不再出现该商品</figcaption><a href="截图/05_发起交易后列表不可见.jpg"><img src="截图/05_发起交易后列表不可见.jpg" alt="发起交易后商品被冻结，买家端列表与搜索结果中不再出现该商品" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/05_发起交易后列表不可见.jpg</p>')"></a></figure><figure id="shot5"><h2>06_冻结商品直链只读</h2><figcaption>冻结商品通过直链打开仍可只读查看，但提交按钮置灰、接口返回 409</figcaption><a href="截图/06_冻结商品直链只读.jpg"><img src="截图/06_冻结商品直链只读.jpg" alt="冻结商品通过直链打开仍可只读查看，但提交按钮置灰、接口返回 409" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/06_冻结商品直链只读.jpg</p>')"></a></figure><figure id="shot6"><h2>07_标记成功库存减一</h2><figcaption>标记交易成功后库存由 3 变为 2，商品回到在售，其余同客户意向作废</figcaption><a href="截图/07_标记成功库存减一.jpg"><img src="截图/07_标记成功库存减一.jpg" alt="标记交易成功后库存由 3 变为 2，商品回到在售，其余同客户意向作废" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/07_标记成功库存减一.jpg</p>')"></a></figure><figure id="shot7"><h2>08_库存归零已售终态</h2><figcaption>库存 1 成交 1 单后库存归零，商品进入"已售（终态）"，并出现在历史商品</figcaption><a href="截图/08_库存归零已售终态.jpg"><img src="截图/08_库存归零已售终态.jpg" alt="库存 1 成交 1 单后库存归零，商品进入"已售（终态）"，并出现在历史商品" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/08_库存归零已售终态.jpg</p>')"></a></figure><figure id="shot8"><h2>09_失败重新排队到队尾</h2><figcaption>标记失败选择重新排队后，该客户排到队尾、下单时间刷新为重排时间</figcaption><a href="截图/09_失败重新排队到队尾.jpg"><img src="截图/09_失败重新排队到队尾.jpg" alt="标记失败选择重新排队后，该客户排到队尾、下单时间刷新为重排时间" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/09_失败重新排队到队尾.jpg</p>')"></a></figure><figure id="shot9"><h2>10_手动下架买家端无法访问</h2><figcaption>手动下架后买家端检索不到，直链详情返回 404</figcaption><a href="截图/10_手动下架买家端无法访问.jpg"><img src="截图/10_手动下架买家端无法访问.jpg" alt="手动下架后买家端检索不到，直链详情返回 404" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/10_手动下架买家端无法访问.jpg</p>')"></a></figure><figure id="shot10"><h2>11_售罄补货仍为下架</h2><figcaption>库存调 0 自动售罄；补货 3 件后状态仍为"售罄下架"，买家端仍不可见</figcaption><a href="截图/11_售罄补货仍为下架.jpg"><img src="截图/11_售罄补货仍为下架.jpg" alt="库存调 0 自动售罄；补货 3 件后状态仍为"售罄下架"，买家端仍不可见" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/11_售罄补货仍为下架.jpg</p>')"></a></figure><figure id="shot11"><h2>12_重新上架恢复在售</h2><figcaption>点击重新上架后回到在售、买家端可见可下单，原队列被清空</figcaption><a href="截图/12_重新上架恢复在售.jpg"><img src="截图/12_重新上架恢复在售.jpg" alt="点击重新上架后回到在售、买家端可见可下单，原队列被清空" loading="lazy" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('afterend','<p style=color:#a64f37>待补充：截图/12_重新上架恢复在售.jpg</p>')"></a></figure></html>
