<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线购物系统</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="container">
  <h1>在线购物系统</h1><section id="product"></section>
