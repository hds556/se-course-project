<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>物流详情 · 拾物小店</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/shop.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">拾物小店 <small>LOGISTICS</small></a>
  <nav id="user-nav"></nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">物流详情</p>
    <h1>订单物流跟踪</h1>
    <p>只有卖家发货后的订单才有物流信息，可查看物流单号、物流公司与跟踪轨迹。跟踪信息为模拟数据，仅供参考。</p>
  </section>

  <section class="panel">
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="content"><p class="muted">正在加载物流信息…</p></div>
  </section>
</main>

<footer>拾物小店 · 物流跟踪信息为模拟数据</footer>

<script>
'use strict';
const orderId = new URLSearchParams(location.search).get('orderId');

const STAGE_ORDER = ['已发货', '运输中', '已签收'];

/** 阶段进度条：已发货 → 运输中 → 已签收 */
function stepper(current) {
  const reached = STAGE_ORDER.indexOf(current);
  return `<ol class="logistics-steps">${STAGE_ORDER.map((stage, index) => `
    <li class="${index <= reached ? 'done' : ''}">
      <span class="step-dot"></span>
      <span class="step-name">${esc(stage)}</span>
    </li>`).join('')}</ol>`;
}

function render(data) {
  if (!data.issued) {
    document.querySelector('#content').innerHTML = `<div class="empty">
      <h2>暂无物流信息</h2>
      <p>订单 <span class="order-no">${esc(data.orderNo)}</span> 当前为「${esc(data.statusLabel)}」，
        卖家发货后即可查看物流单号与跟踪信息。</p>
      <p><a class="button-link" href="/orders.html">返回我的订单</a></p>
    </div>`;
    return;
  }

  const traces = data.traces.map(trace => `<li>
      <span class="trace-stage">${esc(trace.stage)}</span>
      <span class="trace-time">${esc(trace.time)}</span>
      <span class="trace-desc">${esc(trace.description)}</span>
    </li>`).join('');

  document.querySelector('#content').innerHTML = `
    <div class="logistics-head">
      <div><span class="muted">物流公司</span><strong>${esc(data.shipCompanyLabel)}</strong></div>
      <div><span class="muted">物流单号</span><strong class="order-no">${esc(data.trackingNo)}</strong></div>
      <div><span class="muted">订单号</span><strong class="order-no">${esc(data.orderNo)}</strong></div>
      <div><span class="muted">发货时间</span><strong>${esc(fmtTime(data.shippedAt))}</strong></div>
      <div><span class="muted">当前状态</span><span class="order-status progress">${esc(data.currentStage)}</span></div>
    </div>
    ${stepper(data.currentStage)}
    <h2 class="pay-heading">跟踪信息</h2>
    <ul class="logistics-traces">${traces}</ul>
    <p class="muted">${esc(data.message)}。订单状态：${esc(data.statusLabel)}。</p>
    <p><a class="button-link" href="/orders.html">返回我的订单</a></p>`;
}

async function load() {
  if (!orderId) {
    document.querySelector('#content').innerHTML =
      '<div class="empty"><h2>缺少订单</h2><p>请从「我的订单」进入物流详情。</p></div>';
    return;
  }
  try {
    render(await request(`/api/orders/${orderId}/logistics`));
  } catch (error) {
    if (error.status === 401) { toLogin(); return; }
    document.querySelector('#content').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const me = await currentCustomer();
  if (!me) { toLogin(); return; }
  mountUserNav();
  load();
});
</script>
</body>
</html>
