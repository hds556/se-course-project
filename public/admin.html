<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卖家后台</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="container"><h1>卖家后台</h1><section id="login" class="card"><form id="loginForm"><input name="username" value="admin" required><input name="password" type="password" placeholder="密码" required><button>登录</button></form></section>
<section id="dashboard" hidden><div id="current" class="card"></div><div class="card"><h2>发布商品</h2><form id="publish" enctype="multipart/form-data"><input name="name" placeholder="商品名称" required><textarea name="description" placeholder="商品描述" required></textarea><input name="price" placeholder="价格（元）" required><input name="image" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" required><button>发布</button></form></div><div class="card"><h2>意向队列</h2><div id="intents"></div></div><div class="card"><h2>修改密码</h2><form id="password"><input name="oldPassword" type="password" placeholder="原密码" required><input name="newPassword" type="password" placeholder="新密码" required><button>修改</button></form></div><div class="card"><h2>历史商品</h2><div id="history"></div></div></section><p id="message" class="message"></p></main><script src="/admin.js"></script></body></html>
