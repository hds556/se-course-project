<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卖家登录 · 拾物小店</title><link rel="stylesheet" href="/catalog.css"></head><body>
<header><a class="brand" href="/">拾物小店 <small>SELLER SIGN IN</small></a><a href="/">返回小店 ↗</a></header><main class="login-main"><section class="panel"><p class="eyebrow">卖家工作台</p><h1>欢迎回来</h1><p class="muted">登录后管理类别与商品。</p><form id="login-form" class="stack"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录后台</button><p id="error" role="alert" class="error"></p></form></section></main>
<script>document.querySelector('form').onsubmit=async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{const data=Object.fromEntries(new FormData(event.target));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'登录失败');location.href='/admin.html';}catch(e){document.querySelector('#error').textContent=e.message;}finally{button.disabled=false;}};</script></body></html>
