<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的订单 · 拾物小店</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/shop.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">拾物小店 <small>MY ORDERS</small></a>
  <nav id="user-nav"></nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">我的订单</p>
    <h1>我的全部订单</h1>
    <p>进行中、交易完成与已取消的订单都在这里，按下单时间倒序排列。订单只读，不可修改与删除。</p>
    <p>「客户下单 / 待支付」可去支付（下单后 24 小时内未支付将自动取消）；「开始发货」订单可查看物流并确认收货。</p>
  </section>

  <section class="panel">
    <div class="section-heading">
      <h2>订单列表</h2>
      <button id="refresh" type="button" class="secondary">刷新</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="content"><p class="muted">正在加载订单…</p></div>
    <nav id="pagination" class="pagination" aria-label="订单分页"></nav>
  </section>
</main>

<footer>拾物小店 · 线下交易，安心挑选</footer>

<script>
'use strict';
let page = 1;

/* 状态标签：进行中（暖色）/ 交易完成（绿）/ 已取消（灰） */
function statusClass(status) {
  if (status === 'completed') return 'order-status completed';
  if (status === 'cancelled') return 'order-status cancelled';
  return 'order-status progress';
}

/**
 * 单条订单：摘要行（订单号、下单时间、总额、状态、操作）+ 行内展开的明细。
 * 明细直接由接口随订单一起返回，展开时无需再次请求。
 *
 * 操作按钮全部按后端给出的布尔量渲染，前端不推断状态机
 * （payable / confirmable / logisticsAvailable / cancellable）。
 */
function row(order) {
  const lines = order.items.map(line => `<tr>
      <td>${esc(line.productName)}</td>
      <td>${money(line.unitPriceCents)}</td>
      <td>${line.quantity}</td>
      <td>${money(line.subtotalCents)}</td>
    </tr>`).join('');

  const ops = [];
  // 14257 支付订单：仅「客户下单 / 待支付」且未超 24h 才有入口
  if (order.payable) {
    ops.push(`<a class="button-link" href="/payment.html?orderId=${order.id}">去支付</a>`);
  }
  // 14259 查询物流：发货后才显示
  if (order.logisticsAvailable) {
    ops.push(`<a class="button-link secondary" href="/logistics.html?orderId=${order.id}">查看物流</a>`);
  }
  // 14258 确认收货：仅「开始发货」可确认，且需二次确认（终态不可逆）
  if (order.confirmable) {
    ops.push(`<button type="button" data-confirm="${order.id}">确认收货</button>`);
  }
  if (order.cancellable) {
    ops.push(`<button type="button" class="secondary" data-cancel="${order.id}">取消订单</button>`);
  }

  // 支付 / 物流摘要：只展示实际存在的字段（未支付不显示渠道，未发货不显示单号）
  const facts = [];
  if (order.payChannelLabel) facts.push(`支付渠道 ${esc(order.payChannelLabel)}`);
  if (order.trackingNo) {
    facts.push(`物流单号 ${esc(order.trackingNo)}${order.shipCompanyLabel ? `（${esc(order.shipCompanyLabel)}）` : ''}`);
  }
  if (order.expired) facts.push('已超支付时限，系统将自动取消');
  else if (order.remainingSeconds > 0) facts.push(`支付剩余 ${remaining(order.remainingSeconds)}`);

  return `<details class="order-card" data-order="${order.id}">
    <summary>
      <span class="order-no">订单号 ${esc(order.orderNo)}</span>
      <span class="muted">${esc(fmtTime(order.createdAt))}</span>
      <span class="order-count muted">${order.items.length} 种商品</span>
      <span class="money">${money(order.totalCents)}</span>
      <span class="${statusClass(order.status)}">${esc(order.statusLabel)}</span>
      <span class="order-ops">${ops.join('')}</span>
    </summary>
    <div class="order-detail">
      <table class="orders-table">
        <thead><tr><th>商品名称</th><th>下单单价</th><th>数量</th><th>小计</th></tr></thead>
        <tbody>${lines}</tbody>
      </table>
      ${facts.length ? `<p class="order-facts">${facts.join(' · ')}</p>` : ''}
      <p class="muted">订单合计 ${money(order.totalCents)}。下单后商品价格如有调整，本单明细仍按下单时的单价显示。</p>
    </div>
  </details>`;
}

/** 剩余支付时间：把秒数转成「X 小时 Y 分」 */
function remaining(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return hours > 0 ? `${hours} 小时 ${minutes} 分` : `${minutes} 分钟`;
}

/* keepNotice=true 时保留当前提示（取消订单后刷新列表，提示不应被清掉） */
async function load(keepNotice) {
  const box = document.querySelector('#content');
  if (!keepNotice) setNotice('#notice', '');
  try {
    const data = await request(`/api/orders?page=${page}&size=10`);
    if (!data.items.length) {
      box.innerHTML = '<div class="empty"><h2>还没有订单</h2>'
        + '<p>把心仪的商品加入购物车后，即可在购物车一次性下单。</p><a href="/">去逛逛商品</a></div>';
      document.querySelector('#pagination').innerHTML = '';
      return;
    }
    box.innerHTML = data.items.map(row).join('');
    renderPaging('#pagination', data, next => { page = next; load(); });
  } catch (error) {
    if (error.status === 401) { toLogin(); return; }
    box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    document.querySelector('#pagination').innerHTML = '';
  }
}

/* 取消订单与确认收货的按钮都位于 <summary> 内，点击默认会折叠/展开订单，
   因此同时阻止 click 与 mousedown 的默认行为 */
document.querySelector('#content').addEventListener('mousedown', event => {
  if (event.target.closest('[data-cancel],[data-confirm]')) event.preventDefault();
});

document.querySelector('#content').addEventListener('click', async event => {
  const cancelButton = event.target.closest('[data-cancel]');
  const confirmButton = event.target.closest('[data-confirm]');
  if (!cancelButton && !confirmButton) return;
  event.preventDefault();
  event.stopPropagation();

  if (confirmButton) {
    // 确认收货是终态动作、不可逆，因此唯一需要一次确认的地方（FR-C-11）
    if (!confirm('确认已收到商品？确认后订单将「交易完成」，不可撤销。')) return;
    confirmButton.disabled = true;
    try {
      const result = await postJson(`/api/orders/${confirmButton.dataset.confirm}/confirm`);
      await load(true);
      setNotice('#notice', `订单 ${result.orderNo} 已${result.statusLabel}，感谢您的购买`, 'success');
    } catch (error) {
      confirmButton.disabled = false;
      setNotice('#notice', error.message, 'error');
    }
    return;
  }

  // 取消订单：点一次立即生效，不填原因、不二次确认（FR-C-10）
  cancelButton.disabled = true;
  try {
    const result = await postJson(`/api/orders/${cancelButton.dataset.cancel}/cancel`);
    /* statusLabel 已经是「已取消」，这里不要再加「已」字；已付款段取消会原路退款 */
    const message = result.refunded
      ? `订单 ${result.orderId} 状态：${result.statusLabel}，${money(result.refundCents)} 已原路退回${result.refundChannelLabel}，商品库存已回补`
      : `订单 ${result.orderId} 状态：${result.statusLabel}，商品库存已回补`;
    await load(true);
    setNotice('#notice', message, 'success');
  } catch (error) {
    cancelButton.disabled = false;
    setNotice('#notice', error.message, 'error');
  }
});

document.querySelector('#refresh').onclick = () => load();

/* 内联脚本先于 defer 的 shop.js 执行，需等 DOMContentLoaded 后再调用其函数 */
document.addEventListener('DOMContentLoaded', async () => {
  const me = await currentCustomer();
  if (!me) { toLogin(); return; }
  mountUserNav();
  load();
});
</script>
</body>
</html>
