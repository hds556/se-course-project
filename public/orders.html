<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的订单 · 拾物小店</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/shop.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">拾物小店 <small>MY ORDERS</small></a>
  <nav id="user-nav"></nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">我的订单</p>
    <h1>我的全部订单</h1>
    <p>进行中、交易完成与已取消的订单都在这里，按下单时间倒序排列。订单只读，不可修改与删除。</p>
  </section>

  <section class="panel">
    <div class="section-heading">
      <h2>订单列表</h2>
      <button id="refresh" type="button" class="secondary">刷新</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="content"><p class="muted">正在加载订单…</p></div>
    <nav id="pagination" class="pagination" aria-label="订单分页"></nav>
  </section>
</main>

<footer>拾物小店 · 线下交易，安心挑选</footer>

<script>
'use strict';
let page = 1;

/* 状态标签：进行中（暖色）/ 交易完成（绿）/ 已取消（灰） */
function statusClass(status) {
  if (status === 'completed') return 'order-status completed';
  if (status === 'cancelled') return 'order-status cancelled';
  return 'order-status progress';
}

/**
 * 单条订单：摘要行（订单号、下单时间、总额、状态、操作）+ 行内展开的明细。
 * 明细直接由接口随订单一起返回，展开时无需再次请求。
 */
function row(order) {
  const lines = order.items.map(line => `<tr>
      <td>${esc(line.productName)}</td>
      <td>${money(line.unitPriceCents)}</td>
      <td>${line.quantity}</td>
      <td>${money(line.subtotalCents)}</td>
    </tr>`).join('');
  const cancel = order.cancellable
    ? `<button type="button" class="secondary" data-cancel="${order.id}">取消订单</button>`
    : '';
  return `<details class="order-card" data-order="${order.id}">
    <summary>
      <span class="order-no">订单号 ${esc(order.orderNo)}</span>
      <span class="muted">${esc(fmtTime(order.createdAt))}</span>
      <span class="order-count muted">${order.items.length} 种商品</span>
      <span class="money">${money(order.totalCents)}</span>
      <span class="${statusClass(order.status)}">${esc(order.statusLabel)}</span>
      <span class="order-ops">${cancel}</span>
    </summary>
    <div class="order-detail">
      <table class="orders-table">
        <thead><tr><th>商品名称</th><th>下单单价</th><th>数量</th><th>小计</th></tr></thead>
        <tbody>${lines}</tbody>
      </table>
      <p class="muted">订单合计 ${money(order.totalCents)}。下单后商品价格如有调整，本单明细仍按下单时的单价显示。</p>
    </div>
  </details>`;
}

/* keepNotice=true 时保留当前提示（取消订单后刷新列表，提示不应被清掉） */
async function load(keepNotice) {
  const box = document.querySelector('#content');
  if (!keepNotice) setNotice('#notice', '');
  try {
    const data = await request(`/api/orders?page=${page}&size=10`);
    if (!data.items.length) {
      box.innerHTML = '<div class="empty"><h2>还没有订单</h2>'
        + '<p>把心仪的商品加入购物车后，即可在购物车一次性下单。</p><a href="/">去逛逛商品</a></div>';
      document.querySelector('#pagination').innerHTML = '';
      return;
    }
    box.innerHTML = data.items.map(row).join('');
    renderPaging('#pagination', data, next => { page = next; load(); });
  } catch (error) {
    if (error.status === 401) { toLogin(); return; }
    box.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    document.querySelector('#pagination').innerHTML = '';
  }
}

/* 取消订单：点一次立即生效，不填原因、不二次确认（FR-C-09）
   按钮位于 <summary> 内，点击默认会折叠/展开订单，因此同时阻止 click 与 mousedown 的默认行为 */
document.querySelector('#content').addEventListener('mousedown', event => {
  if (event.target.closest('[data-cancel]')) event.preventDefault();
});

document.querySelector('#content').addEventListener('click', async event => {
  const button = event.target.closest('[data-cancel]');
  if (!button) return;
  event.preventDefault();
  event.stopPropagation();
  button.disabled = true;
  try {
    const result = await postJson(`/api/orders/${button.dataset.cancel}/cancel`);
    /* statusLabel 已经是「已取消」，这里不要再加「已」字 */
    const message = `订单 ${result.orderId} 状态：${result.statusLabel}，商品库存已回补`;
    await load(true);
    setNotice('#notice', message, 'success');
  } catch (error) {
    button.disabled = false;
    setNotice('#notice', error.message, 'error');
  }
});

document.querySelector('#refresh').onclick = () => load();

/* 内联脚本先于 defer 的 shop.js 执行，需等 DOMContentLoaded 后再调用其函数 */
document.addEventListener('DOMContentLoaded', async () => {
  const me = await currentCustomer();
  if (!me) { toLogin(); return; }
  mountUserNav();
  load();
});
</script>
</body>
</html>
