<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的购物车 · 拾物小店</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/shop.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">拾物小店 <small>MY CART</small></a>
  <nav id="user-nav"></nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">购物车</p>
    <h1>挑好了就一起下单</h1>
    <p>勾选一件或多件商品一次性提交。已下架的商品会自动置灰，不能勾选下单。</p>
  </section>

  <section class="panel">
    <div class="section-heading">
      <h2>购物车清单</h2>
      <div class="actions">
        <button id="refresh" type="button" class="secondary">刷新</button>
      </div>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>

    <!-- 勾选后点击这里提交；唯一的下单入口（商品详情页不提供立即购买） -->
    <div id="checkout-bar" class="cart-checkout" hidden>
      <span id="selected-summary" class="muted"></span>
      <strong id="selected-total" class="money"></strong>
      <button id="submit-order" type="button">提交订单</button>
    </div>

    <div id="cart-content"><p class="muted">正在加载购物车…</p></div>
  </section>
</main>

<dialog id="checkout-dialog" aria-labelledby="checkout-title"><h2 id="checkout-title">确认订单与收货地址</h2>
<p id="checkout-items"></p><p id="checkout-amount" class="money"></p>
<label>收货地址（下单后不可修改）<select id="checkout-address"></select></label>
<details><summary>添加另一个收货地址</summary><form id="checkout-address-form" class="stack"><label>完整收货地址<input name="addressText" maxlength="200" required placeholder="收件人、电话、省市区和详细地址"></label><button type="submit" class="secondary">添加并选择</button></form></details>
<p id="checkout-error" class="error" role="alert"></p><p>提交成功即占用库存，请在24小时内完成支付。支付为模拟流程。</p>
<div class="actions"><button id="confirm-order" type="button">确认提交订单</button><button id="close-checkout" type="button" class="secondary">返回购物车</button></div></dialog>
<footer>拾物小店 · 在线下单，安心挑选</footer>

<script>
'use strict';
let cartItems = [];
/* 勾选状态：只在前端保存，提交时把购物车项 id 交给后端（后端仍以登录客户为过滤条件） */
const selected = new Set();
let busy = false;

/* 每个商品行都保留一个空的错误位，提交失败后由 markError 填入逐商品原因 */
function cell(productId, message) {
  return `<span class="item-error" data-error-for="${productId}">${message ? esc(message) : ''}</span>`;
}

function row(item) {
  const disabled = !item.available;
  const checked = selected.has(item.id);
  return `<div class="cart-row ${disabled ? 'offline' : ''}" data-id="${item.id}" data-product="${item.productId}">
    <label class="cart-check">
      <input type="checkbox" data-pick="${item.id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
    </label>
    <img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy">
    <div class="cart-info">
      <a href="/?product=${item.productId}">${esc(item.name)}</a>
      <span class="${disabled ? 'tag-offline' : 'muted'}">${esc(item.statusLabel)}${disabled ? ' · 不可下单' : ` · 可售 ${item.stock} 件`}</span>
      ${cell(item.productId, '')}
    </div>
    <div class="cart-price">${money(item.priceCents)}</div>
    <div class="cart-qty">
      <button type="button" class="secondary" data-step="-1" ${disabled ? 'disabled' : ''}>−</button>
      <input type="number" min="1" step="1" value="${item.quantity}" data-qty="${item.id}" ${disabled ? 'disabled' : ''}>
      <button type="button" class="secondary" data-step="1" ${disabled ? 'disabled' : ''}>+</button>
    </div>
    <div class="cart-subtotal">${money(item.subtotalCents)}</div>
    <div class="cart-ops"><button type="button" class="secondary" data-remove="${item.id}">移除</button></div>
  </div>`;
}

function render() {
  const box = document.querySelector('#cart-content');
  if (!cartItems.length) {
    box.innerHTML = '<div class="empty"><h2>购物车还是空的</h2><p>去商品列表挑几件喜欢的商品吧。</p><a href="/">去逛逛商品</a></div>';
    document.querySelector('#checkout-bar').hidden = true;
    return;
  }
  box.innerHTML = `<div class="cart-head muted">
      <span>选择</span><span>商品</span><span>单价</span><span>数量</span><span>小计</span><span>操作</span>
    </div>${cartItems.map(row).join('')}`;
  document.querySelector('#checkout-bar').hidden = false;
  updateSummary();
}

function updateSummary() {
  const picked = cartItems.filter(item => selected.has(item.id) && item.available);
  const total = picked.reduce((sum, item) => sum + item.priceCents * item.quantity, 0);
  document.querySelector('#selected-summary').textContent = `已选 ${picked.length} 件商品`;
  document.querySelector('#selected-total').textContent = money(total);
  document.querySelector('#submit-order').disabled = busy || picked.length === 0;
}

/* 逐商品错误：记在 itemErrors 里，re-render 之后再回填，避免被列表刷新冲掉 */
const itemErrors = new Map();

function markErrors(errors) {
  Object.entries(errors || {}).forEach(([productId, message]) => itemErrors.set(String(productId), message));
  applyErrors();
}

function applyErrors() {
  itemErrors.forEach((message, productId) => {
    const node = document.querySelector(`[data-error-for="${productId}"]`);
    if (node) node.textContent = message;
  });
}

async function load() {
  try {
    const data = await request('/api/cart');
    cartItems = data.items || [];
    /* 已被移除或已下架的条目，退出勾选状态 */
    const alive = new Set(cartItems.filter(item => item.available).map(item => item.id));
    [...selected].forEach(id => { if (!alive.has(id)) selected.delete(id); });
    render();
    applyErrors();
  } catch (error) {
    if (error.status === 401) { toLogin(); return; }
    document.querySelector('#cart-content').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  }
}

/* 事件代理：勾选、加减数量、手工输入数量、移除 */
document.querySelector('#cart-content').onclick = async event => {
  const pick = event.target.closest('[data-pick]');
  const step = event.target.closest('[data-step]');
  const remove = event.target.closest('[data-remove]');

  if (pick) {
    if (pick.checked) selected.add(Number(pick.dataset.pick)); else selected.delete(Number(pick.dataset.pick));
    updateSummary();
    return;
  }

  if (step) {
    const id = Number(step.closest('.cart-row').querySelector('[data-qty]').dataset.qty);
    const input = step.closest('.cart-row').querySelector('[data-qty]');
    const next = Number(input.value) + Number(step.dataset.step);
    if (next < 1) return;
    await changeQuantity(id, next, input);
    return;
  }

  if (remove) {
    const id = Number(remove.dataset.remove);
    remove.disabled = true;
    try {
      await del(`/api/cart/${id}`);
      selected.delete(id);
      setNotice('#notice', '已从购物车移除', 'info');
      await load();
    } catch (error) {
      remove.disabled = false;
      setNotice('#notice', error.message, 'error');
    }
  }
};

/* 手工改数量：输入框失焦或回车时提交，输入非法则回滚原值 */
document.querySelector('#cart-content').onchange = async event => {
  const input = event.target.closest('[data-qty]');
  if (!input) return;
  const id = Number(input.dataset.qty);
  const value = Math.floor(Number(input.value));
  if (!Number.isFinite(value) || value < 1) { await load(); return; }
  await changeQuantity(id, value, input);
};

async function changeQuantity(id, quantity, input) {
  input.disabled = true;
  try {
    await patchJson(`/api/cart/${id}`, { quantity });
    await load();
  } catch (error) {
    input.disabled = false;
    setNotice('#notice', error.message, 'error');
  }
}

let checkoutIds=[],checkoutAddresses=[];
function paintAddresses(chosen){
 const select=document.querySelector('#checkout-address');
 select.innerHTML=checkoutAddresses.length?checkoutAddresses.map(a=>`<option value="${a.id}">${esc(a.addressText)}${a.isDefault?'（默认）':''}</option>`).join(''):'<option value="">请先添加收货地址</option>';
 if(chosen)select.value=String(chosen);else{const def=checkoutAddresses.find(a=>a.isDefault);if(def)select.value=String(def.id);}
 document.querySelector('#confirm-order').disabled=!select.value;
}
async function handleShortages(errors,message){
 for(const item of cartItems)if(Object.hasOwn(errors||{},String(item.productId)))selected.delete(item.id);
 await load();markErrors(errors);updateSummary();
 setNotice('#notice',message||'缺货项已取消勾选，本次未生成订单。请确认剩余商品后重新提交。','warn');
}
document.querySelector('#submit-order').onclick=async()=>{
 if(busy)return;checkoutIds=cartItems.filter(i=>selected.has(i.id)&&i.available).map(i=>i.id);if(!checkoutIds.length)return;
 busy=true;updateSummary();itemErrors.clear();
 try{
  checkoutAddresses=(await request('/api/checkout/addresses')).items;paintAddresses();
  // 先逐项预检，不扣库存。无地址时先展示确认页，引导添加地址。
  if(checkoutAddresses.length){
   const preview=await postJson('/api/orders/preview',{cartItemIds:checkoutIds,addressId:Number(document.querySelector('#checkout-address').value)});
   if(!preview.canSubmit){await handleShortages(preview.itemErrors);return;}
   document.querySelector('#checkout-amount').textContent=money(preview.totalCents);
  }else document.querySelector('#checkout-amount').textContent='请添加地址后提交，最终金额由系统计算';
  document.querySelector('#checkout-items').textContent=cartItems.filter(i=>checkoutIds.includes(i.id)).map(i=>`${i.name} × ${i.quantity}`).join('；');
  document.querySelector('#checkout-error').textContent='';document.querySelector('#checkout-dialog').showModal();
 }catch(e){if(e.status===401){toLogin();return;}setNotice('#notice',e.message,'error');}
 finally{busy=false;updateSummary();}
};
document.querySelector('#checkout-address-form').onsubmit=async event=>{
 event.preventDefault();const button=event.submitter;button.disabled=true;
 try{const added=await postJson('/api/checkout/addresses',{addressText:event.target.elements.addressText.value});checkoutAddresses.push(added);paintAddresses(added.id);event.target.reset();document.querySelector('#checkout-error').textContent='';}
 catch(e){document.querySelector('#checkout-error').textContent=e.message;}finally{button.disabled=false;}
};
document.querySelector('#close-checkout').onclick=()=>{if(!busy)document.querySelector('#checkout-dialog').close();};
document.querySelector('#confirm-order').onclick=async()=>{
 if(busy)return;const addressId=Number(document.querySelector('#checkout-address').value);if(!addressId)return;
 busy=true;document.querySelector('#confirm-order').disabled=true;
 try{
  const order=await postJson('/api/orders',{cartItemIds:checkoutIds,addressId});selected.clear();
  document.querySelector('#checkout-dialog').close();await load();
  setNotice('#notice',`订单 ${order.orderNo} 已生成，合计 ${money(order.totalCents)}。请在24小时内完成支付。`,'success');
  setTimeout(()=>{location.href='/orders.html';},1200);
 }catch(e){if(e.status===401){toLogin();return;}
  document.querySelector('#checkout-error').textContent=e.message;
  if(Object.keys(e.itemErrors||{}).length){document.querySelector('#checkout-dialog').close();await handleShortages(e.itemErrors,e.message+'；请确认剩余商品后重新提交。');}
 }finally{busy=false;document.querySelector('#confirm-order').disabled=false;updateSummary();}
};

document.querySelector('#refresh').onclick = () => load();

/* 本页内联脚本先于 defer 的 shop.js 执行，因此必须等 DOMContentLoaded 之后再调用其函数 */
document.addEventListener('DOMContentLoaded', async () => {
  const me = await currentCustomer();
  if (!me) { toLogin(); return; }
  mountUserNav();
  load();
});
</script>
</body>
</html>
