<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>订单处理 · 卖家工作台</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/seller-orders.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/admin.html">拾物小店 <small>SELLER ORDERS</small></a>
  <nav>
    <a href="/admin.html">← 返回卖家工作台</a>
    <a href="/">查看小店 ↗</a>
    <button id="logout" type="button" class="secondary">退出登录</button>
  </nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">订单处理</p>
    <h1>推进与取消订单</h1>
    <p>卖家只受理<b>已付款</b>订单，按「已支付 → 商家确认 → 备货完成 → 开始发货」逐格推进；未付款订单不可推进，交易完成由客户确认收货触发，卖家不可标记。</p>
    <p>推进到「开始发货」必须填写物流单号，物流公司选填。交易完成之前（含「开始发货」）卖家都可以取消，取消立即生效，不填原因、不做二次确认；已付款段按原渠道退款并按明细回补库存。</p>
  </section>

  <nav class="tabs page-tabs" aria-label="查询维度">
    <button type="button" data-dim="product">按商品查看订单记录</button>
    <button type="button" data-dim="customer" class="secondary">按客户查看购买历史</button>
    <button type="button" data-dim="all" class="secondary">全部订单</button>
  </nav>

  <dialog id="ship-dialog" class="ship-dialog" aria-labelledby="ship-title">
    <h2 id="ship-title">填写发货信息</h2>
    <p class="muted">推进到「开始发货」必须填写物流单号；物流公司选填，默认顺丰。一笔订单对应一个运单。</p>
    <form id="ship-form">
      <label>订单<input id="ship-order" readonly></label>
      <label>物流单号<input id="ship-tracking" maxlength="64" required placeholder="例如 SF1234567890"></label>
      <label>物流公司<select id="ship-company">
        <option value="sf">顺丰速运</option>
        <option value="ems">EMS</option>
        <option value="zto">中通快递</option>
        <option value="yto">圆通速递</option>
        <option value="yd">韵达快递</option>
      </select></label>
      <div class="dialog-actions">
        <button type="button" id="ship-cancel" class="secondary">取消</button>
        <button type="submit" id="ship-confirm">确认发货</button>
      </div>
    </form>
  </dialog>

  <section class="panel">
    <div id="picker" class="seller-filter"></div>
    <div id="dim-head"></div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="content"><p class="muted">正在加载…</p></div>
    <nav id="pagination" class="pagination" aria-label="订单分页"></nav>
  </section>
</main>

<footer>拾物小店 · 卖家工作台 · 订单处理</footer>
</body>
</html>
