<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>收货地址 · 拾物小店</title>
  <link rel="stylesheet" href="/catalog.css">
  <script src="/shop.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">拾物小店 <small>ADDRESS BOOK</small></a>
  <nav id="user-nav"></nav>
</header>

<main>
  <section class="intro compact">
    <p class="eyebrow">收货地址</p>
    <h1>管理我的地址簿</h1>
    <p>可新增、编辑、删除与设置默认地址；删除默认地址后自动将最近添加的一条设为默认。修改地址不会影响已有订单中的地址快照。</p>
  </section>

  <section class="panel">
    <div class="section-heading">
      <h2>我的地址簿</h2>
      <button id="refresh" type="button" class="secondary">刷新</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>

    <form id="add-form" class="address-form">
      <label>新增收货地址
        <input id="new-address" name="addressText" maxlength="200" placeholder="例如：浙江省杭州市西湖区文三路 90 号" required>
      </label>
      <label class="checkbox"><input id="new-default" type="checkbox"> 设为默认地址</label>
      <button type="submit">添加地址</button>
    </form>

    <div id="address-list"><p class="muted">正在加载地址簿…</p></div>
  </section>
</main>

<footer>拾物小店 · 收货地址管理（挑战需求C · 陈心冉）</footer>

<script>
'use strict';

function addressCard(item) {
  const badge = item.isDefault
    ? '<span class="badge badge-active">默认地址</span>'
    : '<span class="badge badge-offline">备用地址</span>';
  return `<article class="address-card ${item.isDefault ? 'default' : ''}" data-id="${item.id}">
    <div class="address-text">${esc(item.addressText)} ${badge}</div>
    <div class="muted">添加时间：${esc(fmtTime(item.createdAt))}</div>
    <div class="actions address-actions">
      <button type="button" data-action="edit" data-id="${item.id}">编辑</button>
      ${item.isDefault ? '' : `<button type="button" class="secondary" data-action="default" data-id="${item.id}">设为默认</button>`}
      <button type="button" class="secondary" data-action="delete" data-id="${item.id}">删除</button>
    </div>
  </article>`;
}

async function load() {
  try {
    const data = await request('/api/addresses');
    const box = document.querySelector('#address-list');
    box.innerHTML = data.items.length
      ? data.items.map(addressCard).join('')
      : '<p class="muted">地址簿为空。添加地址后即可在结算页自动带入。</p>';
  } catch (error) {
    if (error.status === 401) { location.href = '/customer-login.html?redirect=' + encodeURIComponent(location.pathname); return; }
    document.querySelector('#address-list').innerHTML = '<p class="error">' + esc(error.message) + '</p>';
  }
}

document.querySelector('#add-form').onsubmit = async event => {
  event.preventDefault();
  const text = document.querySelector('#new-address').value;
  const isDefault = document.querySelector('#new-default').checked;
  try {
    await postJson('/api/addresses', { addressText: text, isDefault });
    event.target.reset();
    setNotice('#notice', '地址已添加', 'success');
    await load();
  } catch (error) {
    setNotice('#notice', error.fieldErrors.addressText || error.message, 'error');
  }
};

document.querySelector('#address-list').onclick = async event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const id = Number(button.dataset.id);
  try {
    if (button.dataset.action === 'edit') {
      const current = [...document.querySelectorAll('.address-card')]
        .find(node => Number(node.dataset.id) === id)?.querySelector('.address-text')?.textContent || '';
      const text = prompt('修改收货地址', current.replace(/默认地址|备用地址/g, '').trim());
      if (text === null) return;
      await patchJson('/api/addresses/' + id, { addressText: text });
      setNotice('#notice', '地址已更新', 'success');
    } else if (button.dataset.action === 'default') {
      await postJson('/api/addresses/' + id + '/default', {});
      setNotice('#notice', '已设为默认地址', 'success');
    } else if (button.dataset.action === 'delete') {
      if (!confirm('确认删除这条地址？')) return;
      await del('/api/addresses/' + id);
      setNotice('#notice', '地址已删除', 'success');
    }
    await load();
  } catch (error) {
    setNotice('#notice', error.message, 'error');
  }
};

document.querySelector('#refresh').onclick = () => load();

/* 内联脚本先于 defer 的 shop.js 执行，需等 DOMContentLoaded 后再调用其函数 */
document.addEventListener('DOMContentLoaded', async () => {
  const me = await currentCustomer();
  if (!me) { toLogin(); return; }
  mountUserNav();
  load();
});
</script>
</body>
</html>
